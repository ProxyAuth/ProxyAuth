[package]
name = "proxyauth"
version = "0.9.0-beta0"
edition = "2024"
authors = ["Vladimir S"]
repository = "https://git.proxyauth.app/ProxyAuth/ProxyAuth"
readme = "README.md"
license = "Apache-2.0"
description = "Universal Proxy Authentication"
build = "src/build/build.rs"
keywords = ["auth", "proxy", "security", "token", "network"]
categories = ["network-programming", "authentication", "api-bindings", "security"]
documentation = "https://proxyauth.app"
rust-version = "1.92"

include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE"
]

[build]
jobs = 4 # number threads launch for build
rustflags = ["-C", "target-cpu=native"]

[env]
RUST_TEST_THREADS = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[build-dependencies]
rand = "0.8"
rand_chacha = "0.3"
reqwest = { version = "0.11", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
actix-rt = "2"
actix-web = "4"
actix-http = "3.9.0"
serde_json = "1"

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls-0_21"] }
mimalloc = { version = "0.1", default-features = false }
actix-service = "2"
reqwest = { version = "0.11", features = ["native-tls", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
serde_json = "1.0.140"
base64 = "0.21"
sha2 = "0.11.0-rc.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-loki = "0.2.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.3"
tokio = { version = "1", features = ["full"] }
rand = "0.8"
hex = "0.4.3"
chacha20poly1305 = "0.11.0-rc.3" # stable version 0.10.1
actix-governor = "0.10"
quanta = "0.12.5"
argon2 = "0.5"
nix = "0.26"
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
rand_chacha = "0.3"
dashmap = { version = "6.1.0", features = ["serde"] }
once_cell = "1.19"
hyper = { version = "0.14", features = ["client", "http1", "http2", "tcp"] }
hyper-rustls = "0.24"
rustls = "0.21.10"
rustls-native-certs = "0.6"
rustls-pki-types = "1.9"
webpki-roots = "0.25"
hyper-proxy = "0.9"
rustc-hash = "1"
memchr = "2"
futures-util = "0.3"
bytes = "1.11.1"
socket2 = "0.5"
blake3 = "1"
anyhow = "1.0"
base32 = "0.5.1"
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-openssl"] }
data-encoding = "2.3"
urlencoding = "2.1"
totp-rs = "5.5"
ipnet = "2"
serde_urlencoded = "0.7"
ahash = "0.8"
itoa = "1.0"
redis = { version = "0.32", features = ["tokio-comp"] }
lmdb-rkv = "0.14"
time = "0.3"
mime = "0.3"
flate2 = "1"
subtle = "2"
brotli = "3.3"
lru = "0.16"
hkdf = "0.13.0-rc.5"
regex = "1"
serial_test = "3" # it's for coverage code
notify = "6"
arc-swap = "1.8.0"

http = "1"
hyper-tls = "0.5"
hmac = "0.13.0-rc.2"
cookie = "0.18"
lettre = { version = "0.11", default-features = false, features = [ "tokio1-rustls", "builder", "smtp-transport", "ring", "webpki-roots" ] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
panic = "abort"
strip = true
debug = false
incremental = false