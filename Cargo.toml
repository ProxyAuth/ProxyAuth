[package]
name = "proxyauth"
version = "1.2.5"
edition = "2024"
authors = ["Vladimir S"]
repository = "https://git.proxyauth.app/ProxyAuth/ProxyAuth"
readme = "README.md"
license = "Apache-2.0"
description = "Universal Proxy Authentication"
build = "src/build/build.rs"
keywords = ["auth", "proxy", "security", "token", "network"]
categories = ["network-programming", "authentication", "api-bindings", "security"]
documentation = "https://proxyauth.app"
rust-version = "1.92"

include = [
    "src/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "LICENSE"
]

[build]
jobs = 4 # number threads launch for build
rustflags = ["-C", "target-cpu=native"]

[env]
RUST_TEST_THREADS = "1"

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tarpaulin)'] }

[dependencies]
actix-web = { version = "4.12.1", features = ["rustls-0_23"] }
mimalloc = { version = "0.1", default-features = false }
actix-service = "2"
reqwest = { version = "0.13", features = ["rustls", "json", "blocking"] }
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9.33"
serde_json = { version = "1.0.140", features = ["preserve_order"] }
base64 = "0.22.1"
sha2 = "0.11.0-rc.2"
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
tracing-loki = "0.2.6"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10.3"
tokio = { version = "1", features = ["full"] }
rand = { version = "0.10", features = ["chacha"] }
getrandom = "0.3"
hex = "0.4.3"
chacha20poly1305 = "0.11" # stable version 0.10.1
actix-governor = "0.10"
quanta = "0.12.5"
argon2 = "0.5"
nix = "0.26"
thiserror = "2.0"
clap = { version = "4", features = ["derive"] }
dashmap = { version = "6.1.0", features = ["serde"] }
once_cell = "1.19"
hyper       = { version = "1", features = ["server", "http1", "http2", "client"] }
http-body-util = "^0.1"
hyper-util  = { version = "^0.1", features = ["client", "client-legacy", "http1", "http2", "tokio"] }
hyper-http-proxy = "1.2.0"
hyper-rustls = "0.27"
rustls = { version = "0.23", features = ["ring"] }
rustls-native-certs = "0.8"
rustls-pki-types = "1.9"
webpki-roots = "0.26"
rustc-hash = "1"
memchr = "2"
futures-util = "0.3"
bytes = "1.11.1"
socket2 = "0.5"
blake3 = ">=1.8.7"

# Token construction: key derivation, sealing, signature and the
# optional obfuscation pass. Extracted from this crate so the logic can
# be tested and reviewed on its own.
zerocrypt = { version = ">=0.1.7", features = ["cache"] }
anyhow = "1.0"
base32 = "0.5.1"
sequoia-openpgp = { version = "2.1", default-features = false, features = ["crypto-openssl"] }
data-encoding = "2.3"
urlencoding = "2.1"
totp-rs = "5.5"
ipnet = "2"
serde_urlencoded = "0.7"
ahash = "0.8"
itoa = "1.0"
redis = { version = "0.32", features = ["tokio-comp"] }
lmdb-rkv = "0.14"
time = "0.3"
mime = "0.3"
flate2 = "1"
subtle = "2"
brotli = "3.3"
lru = "0.16"
hkdf = "0.13"
regex = "1"
serial_test = "3" # it's for coverage code
notify = "6"
arc-swap = "1.8.0"
diesel = { version = "2.3", features = ["postgres", "mysql", "chrono"] }
http = "1"
hyper-tls = "0.5"
hmac = "0.13"
cookie = "0.18"
lettre = { version = "0.11.22", default-features = false, features = [ "tokio1-rustls", "builder", "smtp-transport", "ring", "webpki-roots" ] }
rpassword = "7.3"
tokio-tungstenite = { version = "0.24", features = ["connect", "rustls-tls-webpki-roots"] }
instant-acme = "0.8"
rcgen = "0.13"
x509-parser = "0.16"
jsonwebtoken = "11"
pem = "3"

# Security-advisory floors, not exact pins — deliberately left as
# ranges so the resolver can still pick up a future patched release
# without needing this file edited again.
[dependencies.rustls-webpki]
version = ">=0.103.13, <0.104.0-alpha.1"
[dependencies.quinn-proto]
version = ">=0.11.15"
[dependencies.h2]
version = ">=0.4.16, <0.5.0"

[dependencies.openssl]
version = ">=0.10.80"

[dependencies.cmov]
version = ">=0.5.4"

[build-dependencies]
rand = { version = "0.10", features = ["chacha"] }
getrandom = "0.3"
reqwest = { version = "0.13", features = ["blocking", "json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
blake3 = "1"

[dev-dependencies]
serial_test = "3"
tokio = { version = "1", features = ["macros", "rt", "time", "test-util"] }
actix-rt = "2"
actix-web = "4"
actix-http = "3.12.1"
serde_json = "1"
ctor = "0.2"

[profile.release]
opt-level = 3
lto = "thin"
codegen-units = 1
strip = true
debug = false
incremental = false
