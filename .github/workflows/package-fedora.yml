name: Build Fedora package

on:
  push:
    tags:
      - 'v*'

  workflow_dispatch:

jobs:
  build-rpm:
    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update

          dnf -y install \
            gcc \
            gcc-c++ \
            make \
            pkg-config \
            openssl-devel \
            postgresql-devel \
            mariadb-connector-c-devel \
            rpm-build \
            rpmdevtools \
            ca-certificates \
            curl \
            file \
            openssl \
            git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          curl --proto '=https' \
            --tlsv1.2 \
            -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal

          . "$HOME/.cargo/env"

          rustc --version
          cargo --version

      - name: Read version
        id: version
        shell: bash
        run: |
          VERSION=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | grep '^version' \
            | head -n1 \
            | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')

          if [ -z "$VERSION" ]; then
            echo "Unable to determine package version"
            exit 1
          fi

          echo "VERSION=$VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Build ProxyAuth
        shell: bash
        run: |
          . "$HOME/.cargo/env"

          cargo build --release --locked

      - name: Verify binary
        shell: bash
        run: |
          test -x target/release/proxyauth

          ./target/release/proxyauth --version || true

          file target/release/proxyauth

          echo "Dynamic dependencies:"
          ldd target/release/proxyauth || true

      - name: Prepare RPM
        env:
          VERSION: ${{ steps.version.outputs.version }}
        shell: bash
        run: |
          set -e

          RPMROOT="$PWD/rpmbuild"

          mkdir -p \
            "$RPMROOT/BUILD" \
            "$RPMROOT/BUILDROOT" \
            "$RPMROOT/RPMS" \
            "$RPMROOT/SOURCES" \
            "$RPMROOT/SPECS" \
            "$RPMROOT/SRPMS"

          cat > "$RPMROOT/SPECS/proxyauth.spec" <<EOF
          Name:           proxyauth
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        ProxyAuth authentication gateway
          License:        Apache-2.0
          URL:            https://proxyauth.app
          Packager:       Vladimir Souchet <staff@proxyauth.app>
          Requires:       openssl
          Requires:       ca-certificates
          Requires:       systemd

          %description
          Secure authentication gateway and reverse proxy written in Rust.

          %prep

          %build

          %install
          mkdir -p %{buildroot}/usr/bin
          mkdir -p %{buildroot}/etc/proxyauth/certs/routes
          mkdir -p %{buildroot}/opt/proxyauth/db
          mkdir -p %{buildroot}/var/log/proxyauth
          mkdir -p %{buildroot}/usr/lib/systemd/system

          install -m 0755 \
            %{_builddir}/proxyauth-binary \
            %{buildroot}/usr/bin/proxyauth

          install -m 0644 \
            %{_builddir}/proxyauth.service \
            %{buildroot}/usr/lib/systemd/system/proxyauth.service

          %pre
          getent group proxyauth >/dev/null || \
              groupadd --system proxyauth

          getent passwd proxyauth >/dev/null || \
              useradd \
                --system \
                --gid proxyauth \
                --no-create-home \
                --shell /usr/sbin/nologin \
                proxyauth

          %post
          mkdir -p /etc/proxyauth/certs/routes
          mkdir -p /opt/proxyauth/db
          mkdir -p /var/log/proxyauth

          chown -R proxyauth:proxyauth /etc/proxyauth
          chown -R proxyauth:proxyauth /opt/proxyauth
          chown -R proxyauth:proxyauth /var/log/proxyauth

          chmod 750 /etc/proxyauth
          chmod 750 /etc/proxyauth/certs
          chmod 750 /etc/proxyauth/certs/routes
          chmod 750 /opt/proxyauth/db
          chmod 750 /var/log/proxyauth

          touch /var/log/proxyauth/proxyauth.log
          touch /var/log/proxyauth/proxyauth.err

          chown proxyauth:proxyauth \
            /var/log/proxyauth/proxyauth.log \
            /var/log/proxyauth/proxyauth.err

          chmod 640 \
            /var/log/proxyauth/proxyauth.log \
            /var/log/proxyauth/proxyauth.err

          if [ ! -f /etc/proxyauth/certs/cert.pem ] || \
             [ ! -f /etc/proxyauth/certs/key.pem ]; then

              openssl req \
                -x509 \
                -newkey rsa:2048 \
                -sha256 \
                -days 7300 \
                -nodes \
                -keyout /etc/proxyauth/certs/key.pem \
                -out /etc/proxyauth/certs/cert.pem \
                -subj "/CN=localhost" \
                >/dev/null 2>&1

              chown proxyauth:proxyauth \
                /etc/proxyauth/certs/cert.pem \
                /etc/proxyauth/certs/key.pem

              chmod 644 /etc/proxyauth/certs/cert.pem
              chmod 640 /etc/proxyauth/certs/key.pem
          fi

          systemctl daemon-reload || true
          systemctl enable proxyauth.service || true

          if /usr/bin/proxyauth prepare >/dev/null 2>&1; then
              true
          fi

          systemctl restart proxyauth.service || \
              systemctl start proxyauth.service || true

          %preun
          if [ "\$1" -eq 0 ]; then
              systemctl stop proxyauth.service 2>/dev/null || true
              systemctl disable proxyauth.service 2>/dev/null || true
          fi

          %postun
          systemctl daemon-reload || true

          %files
          %attr(0755, root, root) /usr/bin/proxyauth
          %{_unitdir}/proxyauth.service

          %config(noreplace) /etc/proxyauth/*
          EOF

          cp target/release/proxyauth \
            "$RPMROOT/BUILD/proxyauth-binary"

          cat > "$RPMROOT/BUILD/proxyauth.service" <<'EOF'
          [Unit]
          Description=ProxyAuth Authentication Proxy
          After=network.target

          [Service]
          Type=simple

          User=proxyauth
          Group=proxyauth

          ExecStart=/usr/bin/proxyauth

          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE

          Restart=on-failure
          RestartSec=5

          Environment=RUST_LOG=info

          WorkingDirectory=/opt/proxyauth

          StandardOutput=append:/var/log/proxyauth/proxyauth.log
          StandardError=append:/var/log/proxyauth/proxyauth.err

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          rpmbuild \
            --define "_topdir $RPMROOT" \
            -bb "$RPMROOT/SPECS/proxyauth.spec"

          mkdir -p dist

          find "$RPMROOT/RPMS" \
            -type f \
            -name '*.rpm' \
            -exec cp {} dist/ \;

          ls -lh dist/

      - name: Generate SHA256
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          cd dist

          sha256sum \
            *.rpm \
            > proxyauth_${VERSION}_fedora_rpm.sha256

          cat proxyauth_${VERSION}_fedora_rpm.sha256

      - name: Upload Fedora package
        uses: actions/upload-artifact@v3
        with:
          name: proxyauth deposite fedora rpm
          path: |
            dist/*.rpm
            dist/*.sha256
