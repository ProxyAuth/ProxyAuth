name: CI/CD ProxyAuth

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  workflow_call:

jobs:

  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: theoparis/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - run: cargo install cargo-audit
      - run: cargo audit

  coverage:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: theoparis/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - name: Install dependancy
        run: apt update && apt install -y nettle-dev

      - name: install tarpaulin for coverage
        run: cargo install cargo-tarpaulin

      - name: Coverage
        run: cargo tarpaulin --all-features --out Html --timeout 300 --engine llvm -- --test-threads=1
        continue-on-error: true

  ci:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: theoparis/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - name: Install dependancy
        run: apt update && apt install -y nettle-dev sudo

      - name: install nextest
        run: cargo install --locked cargo-nextest

      - name: Build the binary
        run: cargo build --release

      - name: Prepare User for run proxyauth
        run: sudo ./target/release/proxyauth prepare --insecure

      - name: Generate self-signed cert for ProxyAuth
        run: |
            sudo mkdir -p /etc/proxyauth/certs
            sudo openssl req -x509 -newkey rsa:2048 -sha256 -days 1 \
            -nodes \
            -keyout /etc/proxyauth/certs/key.pem \
            -out /etc/proxyauth/certs/cert.pem \
            -subj "/CN=localhost"
            sudo chown -R proxyauth:proxyauth /etc/proxyauth/certs

      - name: Test ProxyAuth (unittest)
        run: cargo nextest run --verbose --no-fail-fast --test-threads=1

      - name: Cleanup test database files & Fix permissions
        run: |
            sudo rm -rf /opt/proxyauth/db/*
            sudo chmod 700 -R /opt/proxyauth

      - name: Start ProxyAuth in background
        run: |
          sudo -u proxyauth ./target/release/proxyauth &
          echo $! > proxyauth.pid
          sleep 2  # wait start server
      - name: Test HTTP response
        run: curl -k -I https://localhost:8080 || (cat proxyauth.pid | xargs kill && exit 1)

      - name: Stop the server
        run: |
          cat proxyauth.pid | xargs kill || true

  notify:
    needs: [audit, coverage, ci]

    if: github.event_name == 'pull_request'

    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install jq
        run: |
          apt-get update
          apt-get install -y jq

      - name: Get local version
        id: local_version
        run: |
          VERSION=$(grep -m1 '^version' Cargo.toml | sed 's/version = "\(.*\)"/\1/')
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check if version already published
        id: check_version
        run: |
          RESPONSE=$(curl -s "https://crates.proxyauth.app/api/v1/ui/crate_data?name=proxyauth")
          LOCAL_VERSION="${{ steps.local_version.outputs.version }}"

          EXISTS=$(echo "$RESPONSE" | jq -r --arg v "$LOCAL_VERSION" '[.versions[].version] | any(. == $v)')

          echo "exists=$EXISTS" >> "$GITHUB_OUTPUT"
          echo "version=$LOCAL_VERSION" >> "$GITHUB_OUTPUT"

      - name: Comment on Pull Request
        env:
          FORGEJO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          VERSION="${{ steps.check_version.outputs.version }}"
          EXISTS="${{ steps.check_version.outputs.exists }}"

          if [ "$EXISTS" = "true" ]; then
            BODY="⚠️ **Version conflict**: version \`$VERSION\` already exists on crates.proxyauth.app. \`cargo publish\` will fail until the version in \`Cargo.toml\` is incremented."
          else
            BODY="✅ All checks passed — ProxyAuth v$VERSION is ready to be published."
          fi

          curl -s -X POST \
            "${{ github.api_url }}/repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/comments" \
            -H "Authorization: token $FORGEJO_TOKEN" \
            -H "Content-Type: application/json" \
            -d "$(jq -n --arg body "$BODY" '{body: $body}')"
