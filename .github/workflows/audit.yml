name: Cargo Audit

on:
  push:
    branches: [main]
  pull_request:

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Rust
        uses: theoparis/rust-toolchain@stable
        with:
          toolchain: stable
          override: true

      - run: cargo install cargo-audit
      - run: cargo audit
