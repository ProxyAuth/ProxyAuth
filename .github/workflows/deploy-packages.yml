name: Packages — build & deploy

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag à empaqueter (ex. v1.2.2)"
        required: true
        type: string

      debian:
        description: "Debian / Ubuntu (.deb)"
        type: boolean
        default: true

      alpine:
        description: "Alpine (.apk)"
        type: boolean
        default: true

      arch:
        description: "Arch Linux (.pkg.tar.zst)"
        type: boolean
        default: true

      fedora:
        description: "Fedora (.rpm)"
        type: boolean
        default: true

      centos:
        description: "CentOS Stream (.rpm)"
        type: boolean
        default: true

concurrency:
  group: packages-deploy
  cancel-in-progress: false

permissions:
  contents: read


jobs:

  # ────────────────────────────────────────────────────────────────────
  # Garde de version
  # ────────────────────────────────────────────────────────────────────
  validate:
    name: Validate ${{ inputs.tag }}
    runs-on: ubuntu-latest

    outputs:
      version: ${{ steps.check.outputs.version }}

    steps:
      - name: Checkout the tag
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Check the tag against Cargo.toml
        id: check
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail

          case "$TAG" in
            v[0-9]*) ;;
            *)
              echo "::error::Le tag doit être de la forme vX.Y.Z — reçu « $TAG »"
              exit 1
              ;;
          esac

          VERSION="${TAG#v}"

          CARGO=$(sed -n '/^\[package\]/,/^\[/p' Cargo.toml \
            | grep '^version' \
            | head -n1 \
            | sed -E 's/version[[:space:]]*=[[:space:]]*"([^"]+)"/\1/')

          if [ -z "$CARGO" ]; then
            echo "::error::Version introuvable dans Cargo.toml"
            exit 1
          fi

          if [ "$VERSION" != "$CARGO" ]; then
            echo "::error::Le tag $TAG annonce $VERSION, Cargo.toml déclare $CARGO"
            exit 1
          fi

          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

          {
            echo "### Publication de ProxyAuth $VERSION"
            echo
            echo "| | |"
            echo "|---|---|"
            echo "| Tag | \`$TAG\` |"
            echo "| Commit | \`$(git rev-parse --short HEAD)\` |"
            echo "| Version Cargo.toml | \`$CARGO\` |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Check Cargo.lock is up to date
        shell: bash
        env:
          TAG: ${{ inputs.tag }}
        run: |
          set -uo pipefail

          if [ ! -f Cargo.lock ]; then
            echo "::error::Cargo.lock absent du tag $TAG — il doit être commité pour builder avec --locked"
            exit 1
          fi

          if cargo metadata --locked --format-version 1 >/dev/null; then
            echo "Cargo.lock est à jour."
            exit 0
          fi

          echo "::error::Cargo.lock n'est pas synchronisé avec Cargo.toml au tag $TAG — lance « cargo check » en local et commite Cargo.lock"

          echo
          echo "Modifications que cargo voudrait apporter à Cargo.lock :"
          cargo metadata --format-version 1 >/dev/null || true
          git --no-pager diff -- Cargo.lock

          exit 1

  # ────────────────────────────────────────────────────────────────────
  # Debian / Ubuntu
  # ────────────────────────────────────────────────────────────────────
  debian:
    name: Debian / Ubuntu (.deb)
    needs: validate
    if: ${{ inputs.debian }}

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install build dependencies
        run: |
          # Selon l'image derrière « ubuntu-latest », on est soit root
          # sans sudo (node:*-bookworm), soit un utilisateur avec sudo.
          SUDO=""
          if [ "$(id -u)" -ne 0 ]; then
            SUDO="sudo"
          fi

          $SUDO apt-get update

          $SUDO env DEBIAN_FRONTEND=noninteractive apt-get install -y \
            build-essential \
            pkg-config \
            libssl-dev \
            libpq-dev \
            default-libmysqlclient-dev \
            dpkg-dev \
            fakeroot \
            ca-certificates \
            curl \
            file \
            openssl

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build ProxyAuth
        run: |
          cargo build --release --locked

      - name: Verify binary
        run: |
          test -x target/release/proxyauth

          ./target/release/proxyauth --version || true

          file target/release/proxyauth

          echo "Dynamic dependencies:"
          ldd target/release/proxyauth || true

      - name: Prepare Debian package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu

          PACKAGE="proxyauth_${VERSION}_amd64"
          ROOT="dist/${PACKAGE}"

          mkdir -p "$ROOT/DEBIAN"
          mkdir -p "$ROOT/usr/bin"
          mkdir -p "$ROOT/etc/proxyauth/certs/routes"
          mkdir -p "$ROOT/opt/proxyauth/db"
          mkdir -p "$ROOT/var/log/proxyauth"
          mkdir -p "$ROOT/lib/systemd/system"

          #
          # Binary
          #
          install -m 0755 \
            target/release/proxyauth \
            "$ROOT/usr/bin/proxyauth"

          #
          # systemd service
          #
          cat > "$ROOT/lib/systemd/system/proxyauth.service" <<'EOF'
          [Unit]
          Description=ProxyAuth Authentication Proxy
          After=network.target

          [Service]
          Type=simple

          User=proxyauth
          Group=proxyauth

          ExecStart=/usr/bin/proxyauth

          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE

          Restart=on-failure
          RestartSec=5

          Environment=RUST_LOG=info

          WorkingDirectory=/opt/proxyauth

          StandardOutput=append:/var/log/proxyauth/proxyauth.log
          StandardError=append:/var/log/proxyauth/proxyauth.err

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          #
          # Runtime dependencies
          #
          SHLIBS_WORK=$(mktemp -d)
          mkdir -p "$SHLIBS_WORK/debian"

          cat > "$SHLIBS_WORK/debian/control" <<'EOF'
          Source: proxyauth

          Package: proxyauth
          Architecture: amd64
          EOF

          BIN_PATH="$PWD/$ROOT/usr/bin/proxyauth"

          SHLIBS=$(cd "$SHLIBS_WORK" && dpkg-shlibdeps -O "$BIN_PATH")
          DEPS=$(printf '%s\n' "$SHLIBS" | sed -n 's/^shlibs:Depends=//p')

          if [ -z "$DEPS" ]; then
            echo "::error::dpkg-shlibdeps n'a produit aucune dépendance"
            exit 1
          fi

          echo "Runtime dependencies: $DEPS"

          #
          # Package metadata
          #
          cat > "$ROOT/DEBIAN/control" <<EOF
          Package: proxyauth
          Version: ${VERSION}
          Section: net
          Priority: optional
          Architecture: amd64
          Maintainer: Vladimir Souchet <staff@proxyauth.app>
          Depends: ${DEPS}, openssl, ca-certificates
          Description: ProxyAuth authentication gateway
           Secure authentication gateway and reverse proxy written in Rust.
          EOF

          #
          # postinst
          #
          cat > "$ROOT/DEBIAN/postinst" <<'EOF'
          #!/bin/sh
          set -e

          # Rien à faire pour abort-upgrade, abort-remove, etc.
          [ "$1" = "configure" ] || exit 0

          #
          # System group and user
          #
          if ! getent group proxyauth >/dev/null 2>&1; then
              groupadd --system proxyauth
          fi

          if ! id proxyauth >/dev/null 2>&1; then
              useradd \
                  --system \
                  --gid proxyauth \
                  --no-create-home \
                  --shell /usr/sbin/nologin \
                  proxyauth
          fi

          if getent group www-data >/dev/null 2>&1; then
              usermod -aG www-data proxyauth || true
          fi

          #
          # Directories and log files
          #
          mkdir -p /etc/proxyauth/certs/routes
          mkdir -p /opt/proxyauth/db
          mkdir -p /var/log/proxyauth

          touch /var/log/proxyauth/proxyauth.log
          touch /var/log/proxyauth/proxyauth.err

          #
          # Self-signed certificate, only if none exists
          #
          if [ ! -f /etc/proxyauth/certs/cert.pem ] || \
             [ ! -f /etc/proxyauth/certs/key.pem ]; then

              openssl req \
                  -x509 \
                  -newkey rsa:2048 \
                  -sha256 \
                  -days 7300 \
                  -nodes \
                  -keyout /etc/proxyauth/certs/key.pem \
                  -out /etc/proxyauth/certs/cert.pem \
                  -subj "/CN=localhost" \
                  >/dev/null 2>&1

              chmod 644 /etc/proxyauth/certs/cert.pem
              chmod 640 /etc/proxyauth/certs/key.pem
          fi

          timeout 60 /usr/bin/proxyauth prepare >/dev/null 2>&1 || true

          #
          # Ownership and permissions (après prepare, qui tourne en root)
          #
          chown -R proxyauth:proxyauth /etc/proxyauth
          chown -R proxyauth:proxyauth /opt/proxyauth
          chown -R proxyauth:proxyauth /var/log/proxyauth

          chmod 750 /etc/proxyauth
          chmod 750 /etc/proxyauth/certs
          chmod 750 /etc/proxyauth/certs/routes
          chmod 750 /opt/proxyauth/db
          chmod 750 /var/log/proxyauth

          chmod 640 \
              /var/log/proxyauth/proxyauth.log \
              /var/log/proxyauth/proxyauth.err

          if [ -d /run/systemd/system ]; then
              systemctl daemon-reload
          fi

          if command -v systemctl >/dev/null 2>&1; then
              systemctl enable proxyauth.service >/dev/null 2>&1 || true
          fi

          if [ -d /run/systemd/system ]; then
              systemctl restart proxyauth.service || true
          fi

          exit 0
          EOF

          chmod 0755 "$ROOT/DEBIAN/postinst"

          #
          # prerm
          #
          cat > "$ROOT/DEBIAN/prerm" <<'EOF'
          #!/bin/sh
          set -e

          if [ -d /run/systemd/system ]; then
              systemctl stop proxyauth.service 2>/dev/null || true
          fi

          # On ne désactive le service qu'en cas de suppression,
          # pas lors d'une mise à jour.
          if [ "$1" = "remove" ] && command -v systemctl >/dev/null 2>&1; then
              systemctl disable proxyauth.service 2>/dev/null || true
          fi

          exit 0
          EOF

          chmod 0755 "$ROOT/DEBIAN/prerm"

          #
          # Build package
          #
          dpkg-deb \
            --build \
            --root-owner-group \
            "$ROOT" \
            "dist/${PACKAGE}.deb"

          #
          # Validate package
          #
          dpkg-deb --info "dist/${PACKAGE}.deb"
          dpkg-deb --contents "dist/${PACKAGE}.deb"

      - name: Generate SHA256
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist

          sha256sum \
            "proxyauth_${VERSION}_amd64.deb" \
            > "proxyauth_${VERSION}_amd64.deb.sha256"

          cat "proxyauth_${VERSION}_amd64.deb.sha256"

      - name: Upload Debian package
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxyauth-${{ needs.validate.outputs.version }}-debian
          path: |
            dist/*.deb
            dist/*.deb.sha256

  # ────────────────────────────────────────────────────────────────────
  # Alpine
  # ────────────────────────────────────────────────────────────────────
  alpine:
    name: Alpine (.apk)
    needs: validate
    if: ${{ inputs.alpine }}

    runs-on: ubuntu-latest

    container:
      image: alpine:latest

    steps:
      - name: Install build dependencies
        run: |
          # nodejs + git : requis par actions/checkout et upload-artifact,
          # qui s'exécutent dans ce conteneur.
          apk add --no-cache \
            nodejs \
            git \
            alpine-sdk \
            build-base \
            cargo \
            rust \
            pkgconf \
            openssl-dev \
            openssl-libs-static \
            postgresql-dev \
            mariadb-connector-c-dev \
            zlib-dev \
            zlib-static \
            ca-certificates \
            curl \
            file \
            openssl

      - name: Create build user
        run: |
          adduser -D builder
          addgroup builder abuild

      - name: Configure abuild
        run: |
          mkdir -p /home/builder/.abuild
          chown -R builder:builder /home/builder

          su builder -c 'abuild-keygen -a -n'

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Build ProxyAuth
        env:
          RUSTFLAGS: -C target-feature=-crt-static
        run: |
          cargo build --release --locked

      - name: Verify binary
        run: |
          test -x target/release/proxyauth

          ./target/release/proxyauth --version || true

          file target/release/proxyauth

          echo "Dynamic dependencies:"
          ldd target/release/proxyauth || true

      - name: Prepare Alpine package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu

          APORT="/home/builder/aports/proxyauth"
          REPODEST="/home/builder/repo"

          mkdir -p "$APORT" "$REPODEST" /home/builder/dist

          #
          # APKBUILD
          #
          cat > "$APORT/APKBUILD" <<EOF
          # Contributor: Vladimir Souchet <staff@proxyauth.app>
          # Maintainer: Vladimir Souchet <staff@proxyauth.app>

          pkgname=proxyauth
          pkgver=${VERSION}
          pkgrel=0

          pkgdesc="ProxyAuth authentication gateway"
          url="https://proxyauth.app"
          arch="x86_64"

          license="Apache-2.0"

          depends="
              openssl
              ca-certificates
              openrc
          "

          makedepends=""

          install="
              \$pkgname.pre-install
              \$pkgname.post-install
              \$pkgname.post-upgrade
          "

          source="
              proxyauth
              proxyauth.initd
          "

          options="!check"

          build() {
              :
          }

          package() {
              install -Dm755 \
                  "\$srcdir/proxyauth" \
                  "\$pkgdir/usr/bin/proxyauth"

              install -Dm755 \
                  "\$srcdir/proxyauth.initd" \
                  "\$pkgdir/etc/init.d/proxyauth"
          }
          EOF

          #
          # Binary source
          #
          cp target/release/proxyauth "$APORT/proxyauth"

          #
          # OpenRC service
          #
          cat > "$APORT/proxyauth.initd" <<'EOF'
          #!/sbin/openrc-run

          name="ProxyAuth"
          description="ProxyAuth Authentication Proxy"

          command="/usr/bin/proxyauth"
          command_user="proxyauth:proxyauth"
          command_background="yes"

          directory="/opt/proxyauth"

          output_log="/var/log/proxyauth/proxyauth.log"
          error_log="/var/log/proxyauth/proxyauth.err"

          pidfile="/run/${RC_SVCNAME}.pid"

          export RUST_LOG="${RUST_LOG:-info}"

          depend() {
              need net
              after firewall
          }

          start_pre() {
              checkpath -d -o proxyauth:proxyauth -m 0750 /var/log/proxyauth
          }
          EOF

          chmod 0755 "$APORT/proxyauth.initd"

          #
          # pre-install : création de l'utilisateur système
          #
          cat > "$APORT/proxyauth.pre-install" <<'EOF'
          #!/bin/sh

          addgroup -S proxyauth 2>/dev/null
          adduser -S -D -H \
              -h /opt/proxyauth \
              -s /sbin/nologin \
              -G proxyauth \
              -g "ProxyAuth service user" \
              proxyauth 2>/dev/null

          exit 0
          EOF

          #
          # post-install : répertoires, certificats, prepare, droits
          #
          cat > "$APORT/proxyauth.post-install" <<'EOF'
          #!/bin/sh

          mkdir -p /etc/proxyauth/certs/routes
          mkdir -p /opt/proxyauth/db
          mkdir -p /var/log/proxyauth

          touch /var/log/proxyauth/proxyauth.log
          touch /var/log/proxyauth/proxyauth.err

          if [ ! -f /etc/proxyauth/certs/cert.pem ] || \
             [ ! -f /etc/proxyauth/certs/key.pem ]; then

              openssl req \
                  -x509 \
                  -newkey rsa:2048 \
                  -sha256 \
                  -days 7300 \
                  -nodes \
                  -keyout /etc/proxyauth/certs/key.pem \
                  -out /etc/proxyauth/certs/cert.pem \
                  -subj "/CN=localhost" \
                  >/dev/null 2>&1

              chmod 644 /etc/proxyauth/certs/cert.pem
              chmod 640 /etc/proxyauth/certs/key.pem
          fi

          timeout 60 /usr/bin/proxyauth prepare >/dev/null 2>&1 || true

          chown -R proxyauth:proxyauth /etc/proxyauth
          chown -R proxyauth:proxyauth /opt/proxyauth
          chown -R proxyauth:proxyauth /var/log/proxyauth

          chmod 750 /etc/proxyauth
          chmod 750 /etc/proxyauth/certs
          chmod 750 /etc/proxyauth/certs/routes
          chmod 750 /opt/proxyauth/db
          chmod 750 /var/log/proxyauth

          chmod 640 \
              /var/log/proxyauth/proxyauth.log \
              /var/log/proxyauth/proxyauth.err

          exit 0
          EOF

          cp "$APORT/proxyauth.post-install" "$APORT/proxyauth.post-upgrade"

          chmod 0755 \
            "$APORT/proxyauth.pre-install" \
            "$APORT/proxyauth.post-install" \
            "$APORT/proxyauth.post-upgrade"

          chown -R builder:builder /home/builder

          #
          # Build APK
          #
          su builder -c "
            cd '$APORT' &&
            abuild checksum &&
            REPODEST='$REPODEST' abuild -r
          "

          find "$REPODEST" \
            -type f \
            -name 'proxyauth-*.apk' \
            -exec cp {} /home/builder/dist/ \;

          ls -lh /home/builder/dist

      - name: Generate SHA256
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -e

          cd /home/builder/dist

          APK=$(find . -maxdepth 1 -type f -name 'proxyauth-*.apk' | head -n1)

          if [ -z "$APK" ]; then
            echo "APK package not found"
            exit 1
          fi

          sha256sum "$APK" > "proxyauth_${VERSION}_apk.sha256"

          cat "proxyauth_${VERSION}_apk.sha256"

      - name: Validate APK
        run: |
          set -e

          APK=$(find /home/builder/dist \
            -maxdepth 1 \
            -type f \
            -name 'proxyauth-*.apk' \
            | head -n1)

          ls -lh "$APK"

          apk add --no-cache --allow-untrusted "$APK"

          apk info -L proxyauth

          test -x /usr/bin/proxyauth
          id proxyauth

      - name: Upload Alpine package
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxyauth-${{ needs.validate.outputs.version }}-alpine
          path: |
            /home/builder/dist/*.apk
            /home/builder/dist/*.sha256

  # ────────────────────────────────────────────────────────────────────
  # Arch Linux
  # ────────────────────────────────────────────────────────────────────
  arch:
    name: Arch Linux (.pkg.tar.zst)
    needs: validate
    if: ${{ inputs.arch }}

    runs-on: ubuntu-latest

    container:
      image: archlinux:latest

    steps:
      - name: Install dependencies
        run: |
          # `-Syu` en une passe : un `-Sy` suivi d'un `-S` séparé installe
          # depuis une base rafraîchie sur un système non mis à jour, ce
          # qui casse dès qu'une dépendance a bougé entre les deux.
          pacman -Syu --noconfirm --needed \
            nodejs \
            git \
            base-devel \
            rust \
            openssl \
            pkgconf \
            ca-certificates \
            postgresql-libs \
            mariadb-libs

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Build ProxyAuth
        run: |
          cargo build --release --locked

          test -x target/release/proxyauth

      - name: Create Arch package
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -eu

          mkdir -p arch-package

          cp target/release/proxyauth "arch-package/proxyauth-${VERSION}"

          #
          # PKGBUILD
          #
          cat > arch-package/PKGBUILD <<EOF
          # Maintainer: Vladimir Souchet <staff@proxyauth.app>

          pkgname=proxyauth
          pkgver=${VERSION}
          pkgrel=1
          pkgdesc="Authentication gateway and reverse proxy written in Rust"
          arch=('x86_64')
          url="https://proxyauth.app"
          license=('Apache-2.0')

          depends=(
              'openssl'
              'ca-certificates'
              'systemd'
          )

          options=('!debug')

          install=proxyauth.install

          source=(
              "proxyauth-\${pkgver}"
          )

          sha256sums=(
              'SKIP'
          )

          package() {
              install -Dm755 "\$srcdir/proxyauth-\${pkgver}" \
                  "\$pkgdir/usr/bin/proxyauth"

              install -Dm644 /dev/stdin \
                  "\$pkgdir/usr/lib/systemd/system/proxyauth.service" <<'SERVICE'
          [Unit]
          Description=ProxyAuth Authentication Gateway
          After=network.target

          [Service]
          Type=simple

          User=proxyauth
          Group=proxyauth

          ExecStart=/usr/bin/proxyauth

          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE

          Restart=on-failure
          RestartSec=5

          Environment=RUST_LOG=info

          WorkingDirectory=/opt/proxyauth

          StandardOutput=append:/var/log/proxyauth/proxyauth.log
          StandardError=append:/var/log/proxyauth/proxyauth.err

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          SERVICE

              install -Dm644 /dev/stdin \
                  "\$pkgdir/usr/lib/sysusers.d/proxyauth.conf" <<'SYSUSERS'
          u proxyauth - "ProxyAuth service user" /opt/proxyauth
          SYSUSERS

              install -Dm644 /dev/stdin \
                  "\$pkgdir/usr/lib/tmpfiles.d/proxyauth.conf" <<'TMPFILES'
          d /etc/proxyauth 0750 proxyauth proxyauth -
          d /etc/proxyauth/certs 0750 proxyauth proxyauth -
          d /etc/proxyauth/certs/routes 0750 proxyauth proxyauth -
          d /opt/proxyauth 0750 proxyauth proxyauth -
          d /opt/proxyauth/db 0750 proxyauth proxyauth -
          d /var/log/proxyauth 0750 proxyauth proxyauth -
          TMPFILES
          }
          EOF

          cat > arch-package/proxyauth.install <<'EOF'
          post_install() {
              systemd-sysusers proxyauth.conf
              systemd-tmpfiles --create proxyauth.conf

              touch /var/log/proxyauth/proxyauth.log
              touch /var/log/proxyauth/proxyauth.err
              chmod 640 \
                  /var/log/proxyauth/proxyauth.log \
                  /var/log/proxyauth/proxyauth.err

              if [ ! -f /etc/proxyauth/certs/cert.pem ] || \
                 [ ! -f /etc/proxyauth/certs/key.pem ]; then

                  openssl req \
                      -x509 \
                      -newkey rsa:2048 \
                      -sha256 \
                      -days 7300 \
                      -nodes \
                      -keyout /etc/proxyauth/certs/key.pem \
                      -out /etc/proxyauth/certs/cert.pem \
                      -subj "/CN=localhost" \
                      >/dev/null 2>&1

                  chmod 644 /etc/proxyauth/certs/cert.pem
                  chmod 640 /etc/proxyauth/certs/key.pem
              fi

              timeout 60 /usr/bin/proxyauth prepare >/dev/null 2>&1 || true

              chown -R proxyauth:proxyauth \
                  /etc/proxyauth \
                  /opt/proxyauth \
                  /var/log/proxyauth

              echo "==> Enable the service with: systemctl enable --now proxyauth.service"
          }

          post_upgrade() {
              post_install
          }
          EOF

      - name: Build package
        run: |
          useradd -m builder
          chown -R builder:builder arch-package

          su builder -c \
            'cd arch-package && makepkg --cleanbuild --clean --noconfirm'

      - name: Validate package
        run: |
          PACKAGE=$(find arch-package -name 'proxyauth-*.pkg.tar.*' -type f | head -n1)

          if [ -z "$PACKAGE" ]; then
            echo "Arch package was not generated"
            exit 1
          fi

          echo "Generated package:"
          ls -lh "$PACKAGE"

          pacman -Qp "$PACKAGE"
          pacman -Qlp "$PACKAGE"

      - name: Prepare artifact
        run: |
          mkdir -p dist

          cp arch-package/proxyauth-*.pkg.tar.* dist/

          cd dist

          sha256sum proxyauth-*.pkg.tar.* \
            > proxyauth-arch.sha256

      - name: Upload Arch package
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxyauth-${{ needs.validate.outputs.version }}-arch
          path: dist/

  # ────────────────────────────────────────────────────────────────────
  # Fedora
  # ────────────────────────────────────────────────────────────────────
  fedora:
    name: Fedora (.rpm)
    needs: validate
    if: ${{ inputs.fedora }}

    runs-on: ubuntu-latest

    container:
      image: fedora:latest

    steps:
      - name: Install build dependencies
        run: |
          dnf -y update

          # nodejs + git : requis par checkout / upload-artifact.
          # postgresql-devel retiré : libpq-devel suffit, et le nom
          # n'existe plus sur les Fedora récentes.
          # --allowerasing : l'image embarque curl-minimal, qui entre en
          # conflit avec le paquet curl complet.
          dnf -y install --allowerasing \
            nodejs \
            git \
            gcc \
            gcc-c++ \
            make \
            pkg-config \
            openssl-devel \
            libpq-devel \
            mariadb-connector-c-devel \
            rpm-build \
            ca-certificates \
            curl \
            file \
            openssl

      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable

          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Build ProxyAuth
        shell: bash
        run: |
          cargo build --release --locked

      - name: Verify binary
        shell: bash
        run: |
          test -x target/release/proxyauth

          ./target/release/proxyauth --version || true

          file target/release/proxyauth

          echo "Dynamic dependencies:"
          ldd target/release/proxyauth || true

      - name: Prepare RPM
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          RPMROOT="$PWD/rpmbuild"

          mkdir -p "$RPMROOT"/{BUILD,BUILDROOT,RPMS,SOURCES,SPECS,SRPMS}

          install -m 0755 target/release/proxyauth "$RPMROOT/SOURCES/proxyauth"

          cat > "$RPMROOT/SOURCES/proxyauth.service" <<'EOF'
          [Unit]
          Description=ProxyAuth Authentication Proxy
          After=network.target

          [Service]
          Type=simple

          User=proxyauth
          Group=proxyauth

          ExecStart=/usr/bin/proxyauth

          AmbientCapabilities=CAP_NET_BIND_SERVICE
          CapabilityBoundingSet=CAP_NET_BIND_SERVICE

          Restart=on-failure
          RestartSec=5

          Environment=RUST_LOG=info

          WorkingDirectory=/opt/proxyauth

          StandardOutput=append:/var/log/proxyauth/proxyauth.log
          StandardError=append:/var/log/proxyauth/proxyauth.err

          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
          EOF

          cat > "$RPMROOT/SOURCES/proxyauth.sysusers" <<'EOF'
          u proxyauth - "ProxyAuth service user" /opt/proxyauth /usr/sbin/nologin
          EOF

          #
          # Spec
          #
          cat > "$RPMROOT/SPECS/proxyauth.spec" <<EOF
          %global debug_package %{nil}

          Name:           proxyauth
          Version:        ${VERSION}
          Release:        1%{?dist}
          Summary:        ProxyAuth authentication gateway
          License:        Apache-2.0
          URL:            https://proxyauth.app
          Packager:       Vladimir Souchet <staff@proxyauth.app>

          Source0:        proxyauth
          Source1:        proxyauth.service
          Source2:        proxyauth.sysusers

          Requires:       openssl
          Requires:       ca-certificates
          Requires:       systemd
          Requires(pre):  shadow-utils
          Requires(post): openssl

          %description
          Secure authentication gateway and reverse proxy written in Rust.

          %prep

          %build

          %install
          install -Dm0755 %{SOURCE0} %{buildroot}/usr/bin/proxyauth
          install -Dm0644 %{SOURCE1} %{buildroot}/usr/lib/systemd/system/proxyauth.service
          install -Dm0644 %{SOURCE2} %{buildroot}/usr/lib/sysusers.d/proxyauth.conf

          install -dm0750 %{buildroot}/etc/proxyauth/certs/routes
          install -dm0750 %{buildroot}/opt/proxyauth/db
          install -dm0750 %{buildroot}/var/log/proxyauth

          %pre
          getent group proxyauth >/dev/null || \
              groupadd --system proxyauth

          getent passwd proxyauth >/dev/null || \
              useradd \
                --system \
                --gid proxyauth \
                --no-create-home \
                --shell /usr/sbin/nologin \
                proxyauth

          exit 0

          %post
          touch /var/log/proxyauth/proxyauth.log
          touch /var/log/proxyauth/proxyauth.err

          if [ ! -f /etc/proxyauth/certs/cert.pem ] || \
             [ ! -f /etc/proxyauth/certs/key.pem ]; then

              openssl req \
                -x509 \
                -newkey rsa:2048 \
                -sha256 \
                -days 7300 \
                -nodes \
                -keyout /etc/proxyauth/certs/key.pem \
                -out /etc/proxyauth/certs/cert.pem \
                -subj "/CN=localhost" \
                >/dev/null 2>&1

              chmod 644 /etc/proxyauth/certs/cert.pem
              chmod 640 /etc/proxyauth/certs/key.pem
          fi

          timeout 60 /usr/bin/proxyauth prepare >/dev/null 2>&1 || true

          chown -R proxyauth:proxyauth /etc/proxyauth
          chown -R proxyauth:proxyauth /opt/proxyauth
          chown -R proxyauth:proxyauth /var/log/proxyauth

          chmod 640 \
            /var/log/proxyauth/proxyauth.log \
            /var/log/proxyauth/proxyauth.err

          systemctl daemon-reload >/dev/null 2>&1 || true
          systemctl enable proxyauth.service >/dev/null 2>&1 || true
          systemctl restart proxyauth.service >/dev/null 2>&1 || true

          %preun
          if [ "\$1" -eq 0 ]; then
              systemctl stop proxyauth.service 2>/dev/null || true
              systemctl disable proxyauth.service 2>/dev/null || true
          fi

          %postun
          systemctl daemon-reload >/dev/null 2>&1 || true

          %files
          %attr(0755, root, root) /usr/bin/proxyauth
          /usr/lib/systemd/system/proxyauth.service
          /usr/lib/sysusers.d/proxyauth.conf
          %dir %attr(0750, proxyauth, proxyauth) /etc/proxyauth
          %dir %attr(0750, proxyauth, proxyauth) /etc/proxyauth/certs
          %dir %attr(0750, proxyauth, proxyauth) /etc/proxyauth/certs/routes
          %dir %attr(0750, proxyauth, proxyauth) /opt/proxyauth
          %dir %attr(0750, proxyauth, proxyauth) /opt/proxyauth/db
          %dir %attr(0750, proxyauth, proxyauth) /var/log/proxyauth
          EOF

          rpmbuild \
            --define "_topdir $RPMROOT" \
            -bb "$RPMROOT/SPECS/proxyauth.spec"

          mkdir -p dist

          find "$RPMROOT/RPMS" \
            -type f \
            -name '*.rpm' \
            -exec cp {} dist/ \;

          ls -lh dist/

          rpm -qip dist/*.rpm
          rpm -qlp dist/*.rpm

      - name: Generate SHA256
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          cd dist

          sha256sum \
            *.rpm \
            > proxyauth_${VERSION}_fedora_rpm.sha256

          cat proxyauth_${VERSION}_fedora_rpm.sha256

      - name: Upload Fedora package
        uses: https://code.forgejo.org/forgejo/upload-artifact@v4
        with:
          name: proxyauth-${{ needs.validate.outputs.version }}-fedora
          path: |
            dist/*.rpm
            dist/*.sha256

  # ────────────────────────────────────────────────────────────────────
  # CentOS Stream
  # ────────────────────────────────────────────────────────────────────
  centos:
    name: CentOS Stream (.rpm)
    needs: validate
    if: ${{ inputs.centos }}

    runs-on: ubuntu-latest

    container:
      image: quay.io/centos/centos:stream9

