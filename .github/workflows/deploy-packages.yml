          # ancienne pour actions/checkout@v6 : on active le module 22.
          dnf -y module enable nodejs:22

          # CRB (CodeReady Builder) : contient une partie des -devel.
          # postgresql-devel retiré : libpq-devel suffit.
          dnf -y install --allowerasing --enablerepo=crb \
            nodejs \
            git \
            gcc \
            gcc-c++ \
            make \
            pkg-config \
            openssl-devel \
