  # ────────────────────────────────────────────────────────────────────
  # Summary
  # ────────────────────────────────────────────────────────────────────
  summary:
    name: Summary
    runs-on: ubuntu-latest
    needs: [validate, debian, alpine, arch, fedora, centos]
    if: always() && needs.validate.result == 'success'

    steps:
      - name: Report
        shell: bash
        run: |
          {
            echo "### Paquets — ProxyAuth ${{ needs.validate.outputs.version }}"
            echo
            echo "| Cible | Format | Résultat |"
            echo "|---|---|---|"
            echo "| Debian / Ubuntu | .deb | ${{ needs.debian.result }} |"
            echo "| Alpine | .apk | ${{ needs.alpine.result }} |"
            echo "| Arch Linux | .pkg.tar.zst | ${{ needs.arch.result }} |"
            echo "| Fedora | .rpm | ${{ needs.fedora.result }} |"
            echo "| CentOS Stream | .rpm | ${{ needs.centos.result }} |"
            echo
            echo "Les artefacts sont attachés à cette exécution, un par cible."
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Fail if any enabled target failed
        if: contains(needs.*.result, 'failure')
        run: |
          echo "::error::Au moins un paquet n'a pas été produit — voir le récapitulatif"
          exit 1
