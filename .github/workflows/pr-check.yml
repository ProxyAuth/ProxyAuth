name: ProxyAuth PR checks

on:
  pull_request:
    branches: [main]

concurrency:
  group: pr-checks-${{ github.event.pull_request.number }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: "1"

jobs:

  lint:
    name: Format & lint
    runs-on: ubuntu-latest

    container:
      image: node:24-bookworm
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: Install system dependencies
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            llvm \
            libclang-dev \
            pkg-config \
            libssl-dev \
            libpq-dev \
            default-libmysqlclient-dev \
            nettle-dev \
            ca-certificates \
            curl \
            git

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable --component rustfmt,clippy
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-lint-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-lint-

      - name: Check formatting
        run: |
          if ! cargo fmt --all -- --check; then
            echo "::error::Code is not formatted — run 'cargo fmt --all' and commit the result"
            exit 1
          fi

      - name: Check Cargo.lock is up to date
        run: |
          if ! cargo metadata --locked --format-version 1 >/dev/null; then
            echo "::error::Cargo.lock is out of sync with Cargo.toml — run 'cargo check' locally and commit Cargo.lock"
            exit 1
          fi

      - name: Clippy
        run: |
          cargo clippy --locked --all-targets --all-features

  test:
    name: Build & tests
    runs-on: ubuntu-latest

    container:
      image: node:24-bookworm
      options: --user root --cap-add=SYS_PTRACE

    defaults:
      run:
        shell: bash

    env:
      CARGO_PROFILE_DEV_OPT_LEVEL: "1"

    steps:
      - name: Install system dependencies
        run: |
          set -eu
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends \
            build-essential \
            clang \
            llvm \
            libclang-dev \
            pkg-config \
            libssl-dev \
            libpq-dev \
            default-libmysqlclient-dev \
            nettle-dev \
            ca-certificates \
            curl \
            git \
            jq \
            openssl \
            procps \
            python3 \
            sudo

      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Install cargo-nextest
        run: |
          set -eu
          curl -LsSf https://get.nexte.st/latest/linux | tar zxf - -C "$HOME/.cargo/bin"
          cargo nextest --version

      - name: Restore Cargo cache
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: pr-test-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            pr-test-

      - name: Build ProxyAuth
        run: |
          cargo build --locked --jobs "$(nproc)"
          test -x target/debug/proxyauth

      - name: Prepare user for ProxyAuth
        run: |
          sudo ./target/debug/proxyauth prepare --insecure

      - name: Generate self-signed certificate
        run: |
          set -eu
          sudo mkdir -p /etc/proxyauth/certs
          sudo openssl req \
            -x509 \
            -newkey rsa:2048 \
            -sha256 \
            -days 1 \
            -nodes \
            -keyout /etc/proxyauth/certs/key.pem \
            -out /etc/proxyauth/certs/cert.pem \
            -subj "/CN=localhost" \
            2>/dev/null
          sudo chown -R proxyauth:proxyauth /etc/proxyauth/certs

      - name: Unit and integration tests
        run: |
          cargo nextest run \
            --locked \
            --no-fail-fast \
            --test-threads=1

      - name: Doc tests
        run: |
          cargo test --locked --doc

      - name: Install routes.yml with the route under test
        run: |
          set -eu
          sudo mkdir -p /etc/proxyauth/config

          sudo tee /etc/proxyauth/config/routes.yml >/dev/null <<'YML'
          routes:
            - prefix: "/app"
              target: "http://127.0.0.1:8500"
              required_login: true
              username: ["admin"]
          YML

          sudo chown -R proxyauth:proxyauth /etc/proxyauth/config

      - name: Reset test database
        run: |
          sudo rm -rf /opt/proxyauth/db/*
          sudo chmod 700 -R /opt/proxyauth

      - name: Start test backend on port 8500
        run: |
          set -eu

          cat > /tmp/backend.py <<'PY'
          import hashlib
          import os
          from http.server import BaseHTTPRequestHandler, ThreadingHTTPServer

          BIG = os.urandom(50 * 1024 * 1024)
          with open("/tmp/big.sha256", "w") as f:
              f.write(hashlib.sha256(BIG).hexdigest())

          class Handler(BaseHTTPRequestHandler):
              protocol_version = "HTTP/1.1"

              def log_message(self, *args):
                  pass

              def _reply(self, body, content_type="text/plain", send_body=True):
                  self.send_response(200)
                  self.send_header("Content-Type", content_type)
                  self.send_header("Content-Length", str(len(body)))
                  self.end_headers()
                  if send_body:
                      view = memoryview(body)
                      for i in range(0, len(body), 1024 * 1024):
                          self.wfile.write(view[i:i + 1024 * 1024])

              def do_GET(self, send_body=True):
                  if self.path.endswith("/big"):
                      self._reply(BIG, "application/octet-stream", send_body)
                  else:
                      self._reply(f"BACKEND-OK {self.path}".encode(), send_body=send_body)

              def do_HEAD(self):
                  self.do_GET(send_body=False)

              def do_POST(self):
                  remaining = int(self.headers.get("Content-Length", 0))
                  digest = hashlib.sha256()
                  received = 0
                  while remaining > 0:
                      chunk = self.rfile.read(min(remaining, 1024 * 1024))
                      if not chunk:
                          break
                      digest.update(chunk)
                      received += len(chunk)
                      remaining -= len(chunk)
                  self._reply(f"RECEIVED {received} {digest.hexdigest()}".encode())

          ThreadingHTTPServer(("127.0.0.1", 8500), Handler).serve_forever()
          PY

          python3 /tmp/backend.py >/tmp/backend.log 2>&1 &
          echo $! > backend.pid

          for _ in $(seq 1 30); do
            curl -sf http://127.0.0.1:8500/app >/dev/null && break
            sleep 0.5
          done

          curl -sf http://127.0.0.1:8500/app | grep -q BACKEND-OK

          cat > /tmp/login.sh <<'SH'
          #!/bin/sh
          curl -k -s \
            -X POST https://localhost:8080/auth \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"admin123"}' \
            | jq -r '.token // empty'
          SH
          chmod +x /tmp/login.sh

      - name: Start ProxyAuth
        run: |
          set -eu

          sudo -u proxyauth ./target/debug/proxyauth >/tmp/proxyauth.log 2>&1 &
          echo $! > proxyauth.pid

          for _ in $(seq 1 60); do
            curl -k -s -o /dev/null https://localhost:8080 && exit 0
            sleep 1
          done

          echo "::error::ProxyAuth did not start listening on https://localhost:8080"
          cat /tmp/proxyauth.log
          exit 1

      - name: HTTPS responds
        run: |
          curl -k -s -I https://localhost:8080

      - name: Protected route refuses anonymous requests
        run: |
          set -eu

          code=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8080/app)
          echo "anonymous GET /app -> $code"

          case "$code" in
            2*)
              echo "::error::/app served content without a token"
              exit 1
              ;;
          esac

      - name: Login issues a token that reaches the backend
        run: |
          set -eu

          token=$(/tmp/login.sh)

          if [ -z "$token" ]; then
            echo "::error::/auth did not return a token"
            exit 1
          fi

          echo "token issued, ${#token} chars"

          response=$(curl -k -s -w '\n%{http_code}' https://localhost:8080/app \
            -H "Authorization: Bearer $token")
          code=$(echo "$response" | tail -n1)
          content=$(echo "$response" | sed '$d')

          echo "authenticated GET /app -> $code"

          if [ "$code" != "200" ]; then
            echo "::error::/app answered $code with a valid token"
            exit 1
          fi

          echo "$content" | grep -q BACKEND-OK || {
            echo "::error::/app answered 200 but did not proxy the backend"
            exit 1
          }

          code2=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8080/app \
            -H "Authorization: Bearer $token")
          echo "same token again (cache hit) -> $code2"

          [ "$code2" = "200" ] || {
            echo "::error::the cached path refused a valid token"
            exit 1
          }

      - name: Tampered token is refused
        run: |
          set -eu

          token=$(/tmp/login.sh)
          last="${token: -1}"

          if [ "$last" = "A" ]; then
            tampered="${token%?}B"
          else
            tampered="${token%?}A"
          fi

          code=$(curl -k -s -o /dev/null -w '%{http_code}' https://localhost:8080/app \
            -H "Authorization: Bearer $tampered")
          echo "tampered token -> $code"

          case "$code" in
            2*)
              echo "::error::a tampered token was accepted"
              exit 1
              ;;
          esac

      - name: Wrong credentials are refused
        run: |
          set -eu

          code=$(curl -k -s -o /dev/null -w '%{http_code}' \
            -X POST https://localhost:8080/auth \
            -H 'Content-Type: application/json' \
            -d '{"username":"admin","password":"not-the-password"}')
          echo "bad password -> $code"

          case "$code" in
            2*)
              echo "::error::/auth accepted a wrong password"
              exit 1
              ;;
          esac

      - name: Upload below max_body_size reaches the backend intact
        run: |
          set -eu

          head -c $((5 * 1024 * 1024)) /dev/urandom > /tmp/upload-5m.bin
          expected="RECEIVED $(stat -c %s /tmp/upload-5m.bin) $(sha256sum /tmp/upload-5m.bin | cut -d' ' -f1)"

          token=$(/tmp/login.sh)

          response=$(curl -k -s -w '\n%{http_code}' \
            -X POST https://localhost:8080/app/upload \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/upload-5m.bin)
          code=$(echo "$response" | tail -n1)
          content=$(echo "$response" | sed '$d')

          echo "5 MiB upload -> $code: $content"

          if [ "$code" != "200" ] || [ "$content" != "$expected" ]; then
            echo "::error::the 5 MiB upload did not reach the backend intact (expected: $expected)"
            exit 1
          fi

      - name: Upload above max_body_size is refused
        run: |
          set -eu

          head -c $((12 * 1024 * 1024)) /dev/urandom > /tmp/upload-12m.bin

          token=$(/tmp/login.sh)

          code=$(curl -k -s -o /dev/null -w '%{http_code}' \
            -X POST https://localhost:8080/app/upload \
            -H "Authorization: Bearer $token" \
            -H 'Content-Type: application/octet-stream' \
            --data-binary @/tmp/upload-12m.bin) || true

          echo "12 MiB upload with the default 10 MiB limit -> ${code:-connection closed}"

          case "$code" in
            2*)
              echo "::error::a body larger than max_body_size was accepted"
              exit 1
              ;;
          esac

      - name: Large download is streamed intact
        run: |
          set -eu

          token=$(/tmp/login.sh)

          code=$(curl -k -s \
            -D /tmp/download.headers \
            -o /tmp/download.bin \
            -w '%{http_code}' \
            https://localhost:8080/app/big \
            -H "Authorization: Bearer $token")

          size=$(stat -c %s /tmp/download.bin)
          echo "50 MiB download -> $code, $size bytes"

          if [ "$code" != "200" ]; then
            echo "::error::the download answered $code"
            exit 1
          fi

          if [ "$(sha256sum /tmp/download.bin | cut -d' ' -f1)" != "$(cat /tmp/big.sha256)" ]; then
            echo "::error::the downloaded file differs from what the backend sent"
            exit 1
          fi

          if ! grep -qi "^content-length: $size" /tmp/download.headers; then
            echo "::error::the backend's Content-Length was not passed on to the client"
            cat /tmp/download.headers
            exit 1
          fi

      - name: Write load test helpers
        run: |
          set -eu

          cat > /tmp/load.py <<'PY'
          #!/usr/bin/env python3
          import argparse
          import http.client
          import json
          import ssl
          import threading
          import time

          parser = argparse.ArgumentParser()
          parser.add_argument("--host", default="localhost")
          parser.add_argument("--port", type=int, default=8080)
          parser.add_argument("--paths", nargs="+", default=["/app"])
          parser.add_argument("--requests", type=int, default=100)
          parser.add_argument("--concurrency", type=int, default=8)
          parser.add_argument("--method", default="GET")
          parser.add_argument("--token", default="")
          parser.add_argument("--body", default="")
          parser.add_argument("--content-type", default="")
          parser.add_argument("--no-keepalive", action="store_true")
          parser.add_argument("--timeout", type=float, default=15.0)
          args = parser.parse_args()

          tls = ssl._create_unverified_context()
          lock = threading.Lock()
          barrier = threading.Barrier(args.concurrency)
          next_index = 0
          statuses = {}
          latencies = []
          errors = []

          headers = {}
          if args.token:
              headers["Authorization"] = f"Bearer {args.token}"
          if args.content_type:
              headers["Content-Type"] = args.content_type
          body = args.body.encode() if args.body else None


          def connect():
              conn = http.client.HTTPSConnection(args.host, args.port, context=tls, timeout=args.timeout)
              conn.connect()
              return conn


          def take_index():
              global next_index
              with lock:
                  if next_index >= args.requests:
                      return None
                  next_index += 1
                  return next_index - 1


          def worker():
              conn = None
              try:
                  conn = connect()
              except Exception as exc:
                  with lock:
                      errors.append(f"connect: {type(exc).__name__}: {exc}"[:160])

              barrier.wait()

              while True:
                  index = take_index()
                  if index is None:
                      break

                  path = args.paths[index % len(args.paths)]
                  started = time.perf_counter()

                  try:
                      if conn is None:
                          conn = connect()
                      conn.request(args.method, path, body=body, headers=headers)
                      response = conn.getresponse()
                      response.read()
                      elapsed = time.perf_counter() - started

                      with lock:
                          statuses[response.status] = statuses.get(response.status, 0) + 1
                          latencies.append(elapsed)

                      if args.no_keepalive or response.getheader("connection", "").lower() == "close":
                          conn.close()
                          conn = None
                  except Exception as exc:
                      with lock:
                          errors.append(f"{type(exc).__name__}: {exc}"[:160])
                      if conn is not None:
                          conn.close()
                      conn = None

              if conn is not None:
                  conn.close()


          def percentile(values, p):
              if not values:
                  return 0.0
              ordered = sorted(values)
              rank = min(len(ordered) - 1, max(0, round(p / 100 * (len(ordered) - 1))))
              return ordered[rank] * 1000


          threads = [threading.Thread(target=worker) for _ in range(args.concurrency)]
          start = time.perf_counter()
          for thread in threads:
              thread.start()
          for thread in threads:
              thread.join()
          elapsed = time.perf_counter() - start

          print(json.dumps({
              "requests": args.requests,
              "concurrency": args.concurrency,
              "elapsed_s": round(elapsed, 3),
              "rps": round(len(latencies) / elapsed, 1) if elapsed > 0 else 0,
              "statuses": {str(code): count for code, count in sorted(statuses.items())},
              "errors": len(errors),
              "error_samples": errors[:5],
              "p50_ms": round(percentile(latencies, 50), 2),
              "p95_ms": round(percentile(latencies, 95), 2),
              "p99_ms": round(percentile(latencies, 99), 2),
              "max_ms": round(max(latencies) * 1000, 2) if latencies else 0.0,
          }))
          PY

          cat > /tmp/proxyauth-restart.sh <<'SH'
          #!/bin/bash
          set -eu

          config=/etc/proxyauth/config/config.json

          if [ -f proxyauth.pid ]; then
            xargs kill < proxyauth.pid 2>/dev/null || true
          fi

          for _ in $(seq 1 40); do
            curl -k -s -o /dev/null -m 2 https://localhost:8080 || break
            sleep 0.5
          done
          pkill -KILL -u proxyauth -f 'target/debug/proxyauth' 2>/dev/null || true
          sleep 1

          jq "$1" "$config" > /tmp/config.json.new
          sudo tee "$config" < /tmp/config.json.new >/dev/null
          echo "--- rate limit settings in use ---"
          jq '{ratelimit_proxy, ratelimit_auth}' "$config"

          sudo -u proxyauth ./target/debug/proxyauth >>/tmp/proxyauth.log 2>&1 &
          echo $! > proxyauth.pid

          for _ in $(seq 1 60); do
            if curl -k -s -o /dev/null -m 2 https://localhost:8080; then
              exit 0
            fi
            sleep 1
          done

          echo "::error::ProxyAuth did not come back up with this configuration"
          tail -n 40 /tmp/proxyauth.log
          exit 1
          SH
          chmod +x /tmp/proxyauth-restart.sh

      - name: Restart ProxyAuth with strict rate limits
        run: |
          set -eu

          /tmp/proxyauth-restart.sh '
            .ratelimit_proxy = {"requests_per_second": 1, "burst": 5, "block_delay": 0}
            | .ratelimit_auth = {"requests_per_second": 1, "burst": 3, "block_delay": 0}
          '

          /tmp/login.sh > /tmp/token
          [ -s /tmp/token ] || { echo "::error::login failed after restart"; exit 1; }

      - name: "Rate limit: a burst on the proxy is capped at the configured size"
        run: |
          set -eu

          result=$(python3 /tmp/load.py --paths /app --requests 20 --concurrency 20 --token "$(cat /tmp/token)")
          echo "$result" | jq .

          ok=$(echo "$result" | jq '.statuses["200"] // 0')
          limited=$(echo "$result" | jq '.statuses["429"] // 0')
          errors=$(echo "$result" | jq '.errors')
          other=$(( 20 - ok - limited - errors ))

          echo "20 simultaneous requests, burst 5: $ok accepted, $limited rate-limited, $other other, $errors errors"

          [ "$errors" -eq 0 ] || { echo "::error::connection errors during the burst"; exit 1; }
          [ "$other" -eq 0 ] || { echo "::error::unexpected status codes during the burst"; exit 1; }
          [ "$ok" -ge 5 ] || { echo "::error::only $ok requests accepted, the burst of 5 is not honoured"; exit 1; }
          [ "$ok" -le 7 ] || { echo "::error::$ok requests accepted, the rate limit is not enforced"; exit 1; }

          for _ in 1 2 3 4 5; do
            code=$(curl -k -s -D /tmp/429.headers -o /tmp/429.body -w '%{http_code}' \
              https://localhost:8080/app -H "Authorization: Bearer $(cat /tmp/token)")
            [ "$code" = "429" ] && break
          done

          echo "follow-up request -> $code"
          cat /tmp/429.body; echo

          [ "$code" = "429" ] || { echo "::error::no 429 right after exhausting the burst"; exit 1; }
          grep -qi '^retry-after:' /tmp/429.headers || { echo "::error::429 without a Retry-After header"; exit 1; }
          jq -e '.code == 429' /tmp/429.body >/dev/null || { echo "::error::429 body is not the expected JSON"; exit 1; }

      - name: "Rate limit: access comes back after waiting"
        run: |
          set -eu

          sleep 2

          code=$(curl -k -s -o /dev/null -w '%{http_code}' \
            https://localhost:8080/app -H "Authorization: Bearer $(cat /tmp/token)")
          echo "after waiting 2 s -> $code"

          [ "$code" = "200" ] || { echo "::error::still refused after the rate limit window"; exit 1; }

      - name: "Rate limit: a flood is absorbed without errors"
        run: |
          set -eu

          result=$(python3 /tmp/load.py --paths /app --requests 2000 --concurrency 32 --token "$(cat /tmp/token)")
          echo "$result" | jq .

          ok=$(echo "$result" | jq '.statuses["200"] // 0')
          limited=$(echo "$result" | jq '.statuses["429"] // 0')
          errors=$(echo "$result" | jq '.errors')
          other=$(( 2000 - ok - limited - errors ))
          max_ok=$(echo "$result" | jq '5 + (.elapsed_s | floor) + 2')

          echo "2000 requests: $ok accepted (max allowed $max_ok), $limited rate-limited, $other other, $errors errors"

          [ "$errors" -eq 0 ] || { echo "::error::connection errors under flood"; exit 1; }
          [ "$other" -eq 0 ] || { echo "::error::unexpected status codes under flood (5xx?)"; exit 1; }
          [ "$ok" -le "$max_ok" ] || { echo "::error::the flood got through the rate limit"; exit 1; }

          code=$(curl -k -s -m 5 -o /dev/null -w '%{http_code}' \
            https://localhost:8080/app/after-flood -H "Authorization: Bearer $(cat /tmp/token)") || true
          echo "request on another path right after the flood -> $code"

          [ "$code" = "200" ] || { echo "::error::ProxyAuth is no longer serving normally after the flood"; exit 1; }

      - name: "Rate limit: /auth throttles password guessing"
        run: |
          set -eu

          sleep 4

          result=$(python3 /tmp/load.py --method POST --paths /auth --requests 15 --concurrency 15 \
            --content-type application/json --body '{"username":"admin","password":"wrong-password"}')
          echo "$result" | jq .

          limited=$(echo "$result" | jq '.statuses["429"] // 0')
          accepted=$(echo "$result" | jq '[.statuses | to_entries[] | select(.key | startswith("2")) | .value] | add // 0')
          errors=$(echo "$result" | jq '.errors')
          answered=$(( 15 - limited - errors ))

          echo "15 simultaneous wrong passwords, burst 3: $answered answered, $limited rate-limited, $accepted accepted, $errors errors"

          [ "$errors" -eq 0 ] || { echo "::error::connection errors during the /auth burst"; exit 1; }
          [ "$accepted" -eq 0 ] || { echo "::error::a wrong password was accepted"; exit 1; }
          [ "$answered" -ge 3 ] || { echo "::error::the /auth burst of 3 is not honoured"; exit 1; }
          [ "$answered" -le 5 ] || { echo "::error::/auth is not rate-limited ($answered attempts answered)"; exit 1; }

          code=""
          for _ in 1 2 3; do
            code=$(curl -k -s -o /dev/null -w '%{http_code}' \
              -X POST https://localhost:8080/auth \
              -H 'Content-Type: application/json' \
              -d '{"username":"admin","password":"admin123"}')
            [ "$code" = "429" ] && break
          done
          echo "right password while throttled -> $code"

          [ "$code" = "429" ] || { echo "::error::the limit can be bypassed with the right password"; exit 1; }

          sleep 3

          token=$(/tmp/login.sh)
          [ -n "$token" ] || { echo "::error::cannot log in once the /auth limit has expired"; exit 1; }
          echo "login works again once the window has passed"

      - name: Restart ProxyAuth with rate limiting disabled
        run: |
          set -eu

          /tmp/proxyauth-restart.sh '
            .ratelimit_proxy.requests_per_second = 0
            | .ratelimit_auth.requests_per_second = 0
          '

          /tmp/login.sh > /tmp/token
          [ -s /tmp/token ] || { echo "::error::login failed after restart"; exit 1; }

      - name: "Stress: ProxyAuth does not degrade under load"
        run: |
          set -eu

          token=$(cat /tmp/token)
          pid=$(pgrep -u proxyauth -f 'target/debug/proxyauth' | head -n1)
          echo "ProxyAuth pid: $pid"

          rss() { awk '/^VmRSS:/ { print $2 }' "/proc/$pid/status"; }

          python3 /tmp/load.py --paths /app --requests 300 --concurrency 1 --token "$token" > /tmp/stress-before.json
          echo "$(rss)" > /tmp/stress-rss-before

          python3 /tmp/load.py --paths /app /app/a /app/b /app/c --requests 5000 --concurrency 32 \
            --token "$token" > /tmp/stress-keepalive.json

          python3 /tmp/load.py --paths /app --requests 500 --concurrency 16 --no-keepalive \
            --token "$token" > /tmp/stress-new-connections.json

          python3 /tmp/load.py --method POST --paths /auth --requests 100 --concurrency 8 \
            --content-type application/json --body '{"username":"admin","password":"admin123"}' \
            > /tmp/stress-logins.json

          python3 /tmp/load.py --paths /app --requests 300 --concurrency 1 --token "$token" > /tmp/stress-after.json
          echo "$(rss)" > /tmp/stress-rss-after

          kill -0 "$pid" || { echo "::error::ProxyAuth died during the stress test"; exit 1; }

          python3 - <<'CHECK'
          import json, sys

          def load(name):
              with open(f"/tmp/stress-{name}.json") as f:
                  return json.load(f)

          before, after = load("before"), load("after")
          phases = {
              "keep-alive, 32 clients": (load("keepalive"), 5000),
              "new TLS connection each time": (load("new-connections"), 500),
              "logins, 8 clients": (load("logins"), 100),
          }
          rss_before = int(open("/tmp/stress-rss-before").read()) / 1024
          rss_after = int(open("/tmp/stress-rss-after").read()) / 1024

          print(f"{'phase':32} {'req/s':>8} {'p50 ms':>8} {'p95 ms':>8} {'p99 ms':>8} {'max ms':>8}  statuses / errors")
          for label, (r, _) in [("idle latency before", (before, 0)), *phases.items(), ("idle latency after", (after, 0))]:
              print(f"{label:32} {r['rps']:>8} {r['p50_ms']:>8} {r['p95_ms']:>8} {r['p99_ms']:>8} {r['max_ms']:>8}  {r['statuses']} / {r['errors']}")
          print(f"memory (RSS): {rss_before:.1f} MiB before, {rss_after:.1f} MiB after")

          failures = []
          for label, (r, expected) in phases.items():
              if r["errors"]:
                  failures.append(f"{label}: {r['errors']} connection errors, e.g. {r['error_samples'][:2]}")
              if r["statuses"].get("200", 0) != expected:
                  failures.append(f"{label}: expected {expected} × 200, got {r['statuses']}")
          for label, r in [("idle before", before), ("idle after", after)]:
              if r["errors"] or r["statuses"].get("200", 0) != 300:
                  failures.append(f"{label}: {r['statuses']} / {r['errors']} errors")

          allowed = max(3 * before["p50_ms"], before["p50_ms"] + 10)
          if after["p50_ms"] > allowed:
              failures.append(f"latency degraded: p50 went from {before['p50_ms']} ms to {after['p50_ms']} ms (limit {allowed:.1f} ms)")
          if rss_after - rss_before > 200:
              failures.append(f"memory grew by {rss_after - rss_before:.1f} MiB during the stress test")

          for failure in failures:
              print(f"::error::{failure}")
          sys.exit(1 if failures else 0)
          CHECK

      - name: Show logs on failure
        if: failure()
        run: |
          echo "===== ProxyAuth ====="
          cat /tmp/proxyauth.log 2>/dev/null || true
          echo "===== Backend ====="
          cat /tmp/backend.log 2>/dev/null || true

      - name: Stop test servers
        if: always()
        run: |
          [ -f proxyauth.pid ] && xargs kill < proxyauth.pid 2>/dev/null || true
          [ -f backend.pid ] && xargs kill < backend.pid 2>/dev/null || true

  audit:
    name: Security audit
    runs-on: ubuntu-latest

    container:
      image: node:24-bookworm
      options: --user root

    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust
        run: |
          set -eu
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs \
            | sh -s -- -y --profile minimal --default-toolchain stable
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          echo "$HOME/.cargo-tools/bin" >> "$GITHUB_PATH"

      - name: Restore cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo-tools
          key: pr-tools-cargo-audit-v1

      - name: Install cargo-audit
        run: |
          if ! command -v cargo-audit >/dev/null 2>&1; then
            cargo install --locked --root "$HOME/.cargo-tools" cargo-audit
          fi
          cargo audit --version

      - name: Audit dependencies
        run: |
          cargo audit
